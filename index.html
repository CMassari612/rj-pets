// Retry wrapper — retries transient failures (timeouts, 5xx, network errors)
const fetchWithRetry = async (url, options, retries = 2, okStatuses = [200]) => {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url, options);
      if (okStatuses.includes(res.status) || res.ok) return res;
      if (res.status >= 500 && attempt < retries) {
        await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt)));
        continue;
      }
      return res; // return non-retryable errors as-is
    } catch (e) {
      if (attempt < retries) {
        await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt)));
        continue;
      }
      throw e;
    }
  }
};

// Helpers
const fmtPhone = (p) => {
  if (!p) return "";
  const d = p.replace(/\D/g,"");
  return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : p;
};
const fmtDate = (d) => {
  if (!d) return "";
  const dt = new Date(d+"T00:00:00");
  return `${dt.getMonth()+1}/${dt.getDate()}/${dt.getFullYear()}`;
};
const parseDate = (str) => {
  if (!str || !str.trim()) return null;
  const parts = str.trim().split('/');
  if (parts.length === 3) {
    const m = parseInt(parts[0]);
    const d = parseInt(parts[1]);
    let y = parseInt(parts[2]);
    if (y < 100) y += 2000;
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 1900 && y <= 2100) {
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  return undefined;
};
const isExpired = (d) => d ? new Date(d) < new Date() : false;
const isSoon = (d) => {
  if (!d) return false;
  const dt = new Date(d), now = new Date();
  return dt > now && dt - now < 30*86400000;
};

const calcDays = (dateIn, dateOut, timeOut) => {
  if (!dateIn || !dateOut) return null;
  const d1 = new Date(dateIn+"T00:00:00");
  const d2 = new Date(dateOut+"T00:00:00");
  let days = Math.round((d2 - d1) / 86400000);
  if (days < 0) days = 0;
  if (timeOut === "PM") days += 1;
  return days || 1;
};

};

// ====== DATA MIGRATION HELPERS ======
const getFoodsForSlot = (pet, slot) => {
  const jsonField = `foods_${slot}`;
  const arr = pet[jsonField];
  if (arr && Array.isArray(arr) && arr.length > 0) return arr;
  // Fallback: old columns
  const food = pet[`feed_${slot}_kibble`] || "";
  const toppings = pet[`feed_${slot}_toppings`] || "";
  const items = [];
  if (food) items.push({ name: food, qty: "" });
  if (toppings) items.push({ name: toppings, qty: "" });
  return items;
};
const getMedications = (pet) => {
  if (pet.medications && Array.isArray(pet.medications) && pet.medications.length > 0) return pet.medications;
  // Fallback: old columns
  const meds = [];
  if (pet.feed_am_meds_name) meds.push({ name: pet.feed_am_meds_name, qty: pet.feed_am_meds_amt || "", slots: ["am"] });
  if (pet.feed_noon_meds_name) {
    // Check if same med already added
    const existing = meds.find(m => m.name === pet.feed_noon_meds_name);
    if (existing) { if (!existing.slots.includes("noon")) existing.slots.push("noon"); }
    else meds.push({ name: pet.feed_noon_meds_name, qty: pet.feed_noon_meds_amt || "", slots: ["noon"] });
  }
  if (pet.feed_pm_meds_name) {
    const existing = meds.find(m => m.name === pet.feed_pm_meds_name);
    if (existing) { if (!existing.slots.includes("pm")) existing.slots.push("pm"); }
    else meds.push({ name: pet.feed_pm_meds_name, qty: pet.feed_pm_meds_amt || "", slots: ["pm"] });
  }
  return meds;
};

// ====== MONEY HELPERS (whole dollars only) ======
const fmtMoney = (v) => {
  const n = Number(v);
  if (isNaN(n) || v === null || v === undefined) return "$0";
  return "$" + Math.round(n);
};

// ====== MONEY INPUT (shows $X on blur, raw number on focus) ======
function MoneyInput({ value, onSave, style }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState("");
  const numVal = Math.round(Number(value) || 0);

  const handleFocus = (e) => {
    setEditing(true);
    setText(numVal === 0 ? "" : String(numVal));
    setTimeout(() => e.target.select(), 0);
  };
  const handleBlur = () => {
    setEditing(false);
    const n = Math.round(Number(text) || 0);
    if (n !== numVal) onSave(n);
  };
  return editing ? (
    <input className="auto-input" type="number" step="1" style={{width:75,...(style||{})}}
      value={text} onChange={e => setText(e.target.value)}
      onBlur={handleBlur} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
      autoFocus />
  ) : (
    <span className="auto-input" style={{cursor:"text",display:"inline-block",minWidth:60,...(style||{})}}
      onClick={handleFocus} tabIndex={0} onFocus={handleFocus}>
      {fmtMoney(numVal)}
    </span>
  );
}

// ====== DATE INPUT (text-based mm/dd/yyyy) ======
function DateInput({ value, onSave, className }) {
  const [text, setText] = useState(value ? fmtDate(value) : "");
  const [focused, setFocused] = useState(false);
  useEffect(() => { if (!focused) setText(value ? fmtDate(value) : ""); }, [value, focused]);
  const handleBlur = () => {
    setFocused(false);
    const trimmed = text.trim();
    if (!trimmed) { onSave(null); return; }
    const parsed = parseDate(trimmed);
    if (parsed === null) { onSave(null); }
    else if (parsed === undefined) { setText(value ? fmtDate(value) : ""); }
    else { onSave(parsed); }
  };
  return (
    <input type="text" value={text}
      onChange={e => setText(e.target.value)}
      onFocus={() => setFocused(true)}
      onBlur={handleBlur}
      onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
      placeholder="mm/dd/yyyy"
      className={className || "auto-input"} style={{width:120}} />
  );
}

// ====== FOOD MEAL SLOT (replicable food boxes) ======
function FoodMealSlot({ label, foods, onSave }) {
  const [items, setItems] = useState(foods.length > 0 ? foods : []);
  const prevFoods = useRef(JSON.stringify(foods));
  useEffect(() => {
    const s = JSON.stringify(foods);
    if (s !== prevFoods.current) { prevFoods.current = s; setItems(foods.length > 0 ? foods : []); }
  }, [foods]);

  const update = (idx, field, value) => {
    setItems(prev => prev.map((item, i) => i === idx ? {...item, [field]: value} : item));
  };
  const saveAll = (list) => {
    const clean = (list || items).filter(f => f.name && f.name.trim());
    onSave(clean);
  };
  const addFood = () => { setItems(prev => [...prev, {name: "", qty: ""}]); };
  const removeFood = (idx) => {
    const newItems = items.filter((_, i) => i !== idx);
    setItems(newItems);
    saveAll(newItems);
  };

  return (
    <div className="feed-section">
      <div className="feed-label">{label}</div>
      {items.map((food, idx) => (
        <div key={idx} style={{display:"flex", gap:6, alignItems:"center", marginBottom:4}}>
          <input className="auto-input" style={{width:140,fontSize:12}} placeholder="Food name"
            value={food.name} onChange={e => update(idx, "name", e.target.value)}
            onBlur={() => saveAll()} />
          <select className="auto-select" style={{fontSize:12,minWidth:60}} value={food.qty || ""}
            onChange={e => {
              const newItems = items.map((item, i) => i === idx ? {...item, qty: e.target.value} : item);
              setItems(newItems);
              saveAll(newItems);
            }}>
            <option value="">Qty</option>
            {FOOD_QTY_OPTIONS.map(q => <option key={q} value={q}>{q}</option>)}
          </select>
          <button onClick={() => removeFood(idx)} style={{color:"#999",fontSize:16,cursor:"pointer",background:"none",border:"none",padding:"0 4px",lineHeight:1}} title="Remove">&times;</button>
        </div>
      ))}
      <button onClick={addFood} style={{fontSize:11, color:"#2e7d32", cursor:"pointer", background:"none", border:"none", padding:"2px 0", fontWeight:600}}>
        + Add Food
      </button>
    </div>
  );
}

      {meds.map((med, idx) => (
        <div key={idx} style={{display:"flex", gap:8, alignItems:"center", marginBottom:6, padding:"8px 10px", background:"#fff", borderRadius:4, border:"1px solid #e0e0e0"}}>
          <input className="auto-input" style={{width:140,fontSize:13}} placeholder="Med name"
            value={med.name} onChange={e => update(idx, "name", e.target.value)}
            onBlur={() => saveAll()} />
          <select className="auto-select" style={{fontSize:12,minWidth:60}} value={med.qty || ""}
            onChange={e => {
              const newMeds = meds.map((m, i) => i === idx ? {...m, qty: e.target.value} : m);
              setMeds(newMeds);
              saveAll(newMeds);
            }}>
            <option value="">Qty</option>
            {MED_QTY_OPTIONS.map(q => <option key={q} value={q}>{q}</option>)}
          </select>
          <div style={{display:"flex", gap:6, alignItems:"center", fontSize:11}}>
            {["am","noon","pm"].map(slot => (
              <label key={slot} style={{display:"flex", alignItems:"center", gap:2, cursor:"pointer", color:"#555"}}>
                <input type="checkbox" checked={(med.slots||[]).includes(slot)} onChange={() => toggleSlot(idx, slot)} />
                {slot.toUpperCase()}
              </label>
            ))}
          </div>
          <button onClick={() => removeMed(idx)} style={{color:"#999",fontSize:16,cursor:"pointer",background:"none",border:"none",padding:"0 4px",lineHeight:1,marginLeft:"auto"}} title="Remove">&times;</button>
        </div>
      ))}
      <button onClick={addMed} style={{fontSize:12, color:"#2e7d32", cursor:"pointer", background:"none", border:"none", padding:"4px 0", fontWeight:600}}>
        + Add Medication
      </button>
    </div>
  );
}

// ====== WAIVER UPLOAD BOX ======
function WaiverBox({ waiverData, onUpload, onClear }) {
  const fileRef = useRef(null);
  const [showViewer, setShowViewer] = useState(false);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("File too large (max 3MB)"); return; }
    const reader = new FileReader();
    reader.onload = (ev) => { onUpload(ev.target.result); };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const printWaiver = () => {
    const win = window.open("", "_blank");
    const isImage = waiverData && waiverData.startsWith("data:image");
    win.document.write(`<html><head><title>Waiver</title><style>body{margin:0;display:flex;justify-content:center;align-items:start;} img{max-width:100%;height:auto;} iframe{width:100%;height:100vh;border:none;}</style></head><body>`);
    if (isImage) { win.document.write(`<img src="${waiverData}"/>`); }
    else { win.document.write(`<iframe src="${waiverData}"></iframe>`); }
    win.document.write("</body></html>");
    win.document.close();
    setTimeout(() => { win.print(); }, 500);
  };

  return (
    <>
      <input type="file" ref={fileRef} accept="image/*,.pdf" onChange={handleFile} style={{display:"none"}} />
      {waiverData ? (
        <div style={{display:"inline-flex", alignItems:"center", gap:6}}>
          <button onClick={() => setShowViewer(true)}
            style={{padding:"4px 10px", fontSize:12, background:"#e8f5e9", border:"1px solid #a5d6a7", borderRadius:4, cursor:"pointer", color:"#2e7d32", fontWeight:600}}>
            View Waiver
          </button>
          <button onClick={printWaiver}
            style={{padding:"4px 10px", fontSize:12, background:"#e3f2fd", border:"1px solid #90caf9", borderRadius:4, cursor:"pointer", color:"#1565c0", fontWeight:600}}>
            Print
          </button>
          <button onClick={() => fileRef.current?.click()}
            style={{padding:"4px 10px", fontSize:12, background:"#fff3e0", border:"1px solid #ffcc80", borderRadius:4, cursor:"pointer", color:"#e65100", fontWeight:600}}>
            Replace
          </button>
          <button onClick={onClear}
            style={{padding:"4px 8px", fontSize:12, background:"#ffebee", border:"1px solid #ef9a9a", borderRadius:4, cursor:"pointer", color:"#b71c1c"}}>
            &times;
          </button>
        </div>
      ) : (
        <button onClick={() => fileRef.current?.click()}
          style={{padding:"4px 12px", fontSize:12, background:"#f5f5f5", border:"2px dashed #bbb", borderRadius:4, cursor:"pointer", color:"#777"}}>
          Upload Waiver
        </button>
      )}
      {showViewer && (
        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50" style={{zIndex:10000}} onClick={() => setShowViewer(false)}>
          <div style={{maxWidth:900, maxHeight:"90vh", overflow:"auto", background:"white", borderRadius:8, padding:8}} onClick={e => e.stopPropagation()}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
              <span style={{fontWeight:700, fontSize:14}}>Waiver</span>
              <div style={{display:"flex",gap:4}}>
                <button onClick={printWaiver} style={{padding:"4px 12px", fontSize:12, background:"#1976d2", color:"white", border:"none", borderRadius:4, cursor:"pointer"}}>Print</button>
                <button onClick={() => setShowViewer(false)} style={{padding:"4px 12px", fontSize:12, background:"#666", color:"white", border:"none", borderRadius:4, cursor:"pointer"}}>Close</button>
              </div>
            </div>
            {waiverData.startsWith("data:image") ? (
              <img src={waiverData} style={{maxWidth:"100%", height:"auto"}} />
            ) : (
              <iframe src={waiverData} style={{width:800, height:"80vh", border:"none"}} />
            )}
          </div>
        </div>
      )}
    </>
  );
}

}

// Main App
function RJPetsApp() {
  const [record, setRecord] = useState(null);
  const [idx, setIdx] = useState(0);
  const [total, setTotal] = useState(0);
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [connected, setConnected] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [searchIds, setSearchIds] = useState(null);

  // Pets state
  const [pets, setPets] = useState([]);
  const [petIdx, setPetIdx] = useState(0);
  const [showCageCard, setShowCageCard] = useState(false);
  const [confirmDeletePet, setConfirmDeletePet] = useState(false);

  const r = record;
  const currentPet = pets[petIdx] || null;

  const showToast = (msg, type="success") => {
    setToast({msg,type});
    setTimeout(()=>setToast(null), 1500);
  };

  // ====== AUTO-SAVE: save a single client field on blur ======
  const saveClientField = async (field, value) => {
    if (!r || !connected) return;
    const id = r.id;
    const updated = {...r, [field]: value};
    // Recalc if needed
    if (["date_in","date_out","time_out","time_in","num_days","price_per_day","daycare_extra","percent_off","down_payment","cash_discount","bath"].includes(field)) {
      if (field === "date_in" || field === "date_out" || field === "time_out") {
        const dIn = field === "date_in" ? value : updated.date_in;
        const dOut = field === "date_out" ? value : updated.date_out;
        const tOut = field === "time_out" ? value : updated.time_out;
        updated.num_days = calcDays(dIn, dOut, tOut);
        // Auto-discount when days change
        const autoDisc = getAutoDiscount(updated.num_days);
        if (autoDisc !== null) {
          updated.percent_off = autoDisc;
        }
      }
      const days = updated.num_days || 0;
      const price = updated.price_per_day || 0;
      const extras = (updated.daycare_extra || 0) + (updated.bath || 0);
      const pctOff = updated.percent_off || 0;
      let subtotal = days * price;
      if (pctOff > 0) subtotal = subtotal * (1 - pctOff / 100);
      subtotal += extras;
      updated.total = Math.round(subtotal);
      updated.balance = Math.round(updated.total - (updated.down_payment||0) - (updated.cash_discount||0));
    }
    setRecord(updated);
    try {
      const {id: _id, created_at, updated_at, ...rest} = updated;
      await supabase.update("clients", id, rest);
      showToast("Saved");
    } catch(e) { showToast("Save failed: "+e.message, "error"); }
  };

  // ====== AUTO-SAVE: save a single pet field ======
  const savePetField = async (field, value) => {
    if (!currentPet || !connected) return;
    const id = currentPet.id;
    const updated = {...currentPet, [field]: value};
    setPets(p => p.map(x => x.id === id ? updated : x));
    try {
      await supabase.update("pets", id, {[field]: value});
      showToast("Saved");
    } catch(e) { showToast("Save failed: "+e.message, "error"); }
  };

  // Fetch single record at index
  const fetchRecordAt = useCallback(async (index, ids) => {
    try {
      let rec;
      if (ids) {
        if (index < 0 || index >= ids.length) { setRecord(null); return; }
        rec = await supabase.getById("clients", ids[index]);
      } else {
        rec = await supabase.getOne("clients", { offset: index });
      }
      setRecord(rec);
      setConnected(true);
    } catch { setRecord(null); setConnected(false); }
  }, []);

  // Fetch clients (count + first record, or search)
  const fetchRecords = useCallback(async (search="") => {
    setLoading(true);
    try {
      if (search) {
        let ids = await supabase.getSearchIds(search);
        try {
          const petUrl = new URL(`${SUPABASE_URL}/rest/v1/pets`);
          petUrl.searchParams.set("select", "client_id");
          petUrl.searchParams.set("pet_name", `ilike.%${search}%`);
          const petRes = await fetch(petUrl, {
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
          });
          if (petRes.ok) {
            const petMatches = await petRes.json();
            const existingSet = new Set(ids);
            const newIds = [...new Set(petMatches.map(p => p.client_id))].filter(id => !existingSet.has(id));
            ids = [...ids, ...newIds].sort((a, b) => a - b);
          }
        } catch {}
        setSearchIds(ids);
        setTotal(ids.length);
        setIdx(0);
        if (ids.length > 0) {
          const rec = await supabase.getById("clients", ids[0]);
          setRecord(rec);
        } else { setRecord(null); }
      } else {
        setSearchIds(null);
        const count = await supabase.getCount("clients");
        setTotal(count);
        setIdx(0);
        if (count > 0) {
          const rec = await supabase.getOne("clients", { offset: 0 });
          setRecord(rec);
        } else { setRecord(null); }
      }
      setConnected(true);
    } catch {
      setRecord(null); setTotal(0); setIdx(0); setConnected(false); setSearchIds(null);
    }
    setLoading(false);
  },[]);

  const fetchPets = useCallback(async (clientId) => {
    if (!clientId || !connected) { setPets([]); setPetIdx(0); return; }
    try {
      const {data} = await supabase.getByFilter("pets", { client_id: `eq.${clientId}` });
      setPets(data || []); setPetIdx(0);
    } catch { setPets([]); setPetIdx(0); }
  }, [connected]);

  useEffect(()=>{fetchRecords()},[fetchRecords]);
  useEffect(()=>{
    if (record) fetchPets(record.id);
    else { setPets([]); setPetIdx(0); }
  },[record, fetchPets]);

  const go = async (i) => {
    if (i < 0 || i >= total) return;
    setIdx(i);
    setLoading(true);
    await fetchRecordAt(i, searchIds);
    setLoading(false);
  };

  const deletePet = async () => {
    const pet = pets[petIdx];
    if (!pet) return;
    try {
      if (connected) await supabase.delete("pets", pet.id);
      const newPets = pets.filter(p => p.id !== pet.id);
      setPets(newPets);
      setPetIdx(Math.min(petIdx, Math.max(0, newPets.length - 1)));
      setConfirmDeletePet(false);
      showToast("Pet deleted");
    } catch(e) { showToast("Delete pet failed: " + e.message, "error"); }
  };

  const addPet = async () => {
    const client = record;
    if (!client) return;
    const blank = {

    const blank = { owner_name:"New Owner", address:"", phone_primary:"", phone_secondary:"",
      email:"", emergency_contact:"", vet:"",
      date_in:null, date_out:null, time_in:"AM", time_out:"AM",
      num_days:null, price_per_day:null, total:null, balance:null,
      last_service_date:null, down_payment:null, percent_off:null,
      cash_discount:0, daycare_extra:0, bath:0,
      date_of_birth:null, num_pets:null, note_date:null,
      waiver_date: null, waiver_data: null,
      pet_name:"", breed:"", dhpp_date:null, bordetella_exp:null, rabies_exp:null,
      felv_date:null, feeding_instructions:"", food_brand:"", medication_notes:"", notes:"" };
    try {
      if (connected) {
        const {data} = await supabase.insert("clients",blank);
        const newClient = data[0];
        setRecord(newClient); setIdx(total); setTotal(t=>t+1);
        if (searchIds) setSearchIds(ids => [...ids, newClient.id]);
        await supabase.insert("pets", { client_id: newClient.id, pet_name: "New Pet", blanket: "No", foods_am: [], foods_noon: [], foods_pm: [], medications: [] });
      }
    } catch(e) { showToast("Create failed: "+e.message,"error"); }
  };

  const deleteRecord = async () => {
    if (!r) return;
    const deletedId = r.id;
    try {
      if (connected) await supabase.delete("clients", deletedId);
      const newTotal = total - 1;
      const newIds = searchIds ? searchIds.filter(id => id !== deletedId) : null;
      setTotal(newTotal);
      if (newIds) setSearchIds(newIds);
      setConfirmDelete(false);
      if (newTotal > 0) {
        const newIdx = Math.min(idx, newTotal - 1);
        setIdx(newIdx);
        await fetchRecordAt(newIdx, newIds);
      } else {
        setIdx(0); setRecord(null);
      }
      showToast("Record deleted");
    } catch(e) { showToast("Delete failed: "+e.message,"error"); }
  };

  const handleSearch = async () => { await fetchRecords(query); };
  const clearSearch = async () => { setQuery(""); await fetchRecords(""); };

  useEffect(()=>{
    const h = (e) => {
      if(document.activeElement && document.activeElement.tagName==="INPUT") return;
      if(document.activeElement && document.activeElement.tagName==="SELECT") return;
      if(document.activeElement && document.activeElement.tagName==="TEXTAREA") return;
      if(e.key==="ArrowLeft"){e.preventDefault();go(idx-1);}
      if(e.key==="ArrowRight"){e.preventDefault();go(idx+1);}
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  });

  const displayExtras = r ? ((r.daycare_extra || 0) + (r.bath || 0)) : 0;

  const vaxStatus = (date) => {
    const exp = isExpired(date);
    const soon = isSoon(date);
    if (exp) return { label: "EXPIRED", bg: "#dc2626", color: "white" };
    if (soon) return { label: "EXPIRING", bg: "#eab308", color: "black" };
    if (date) return { label: "CURRENT", bg: "#16a34a", color: "white" };
    return { label: "NONE", bg: "#4b5563", color: "white" };
  };

  if (loading) return (
    <div className="flex items-center justify-center h-screen" style={{background:"#e8e8e8"}}>
      <div className="text-center">
        <div className="animate-spin w-10 h-10 border-4 border-gray-500 border-t-transparent rounded-full mx-auto mb-4"/>
        <p style={{color:"#666"}}>Loading RJ Pets...</p>

    </div>

            </div>
          </div>

              <button onClick={deletePet} className="px-4 py-2 text-white rounded text-sm font-medium" style={{background:"#8B0000"}}>Delete Pet</button>

          <span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{background: connected?"#2e7d32":"#c79100", color:"white"}}>

          <span className="text-xs ml-2" style={{color:"#777"}}>{total.toLocaleString()} records</span>

                <span style={{fontSize:12,color:"#888"}}>Emg: </span>

                  onBlur={e=>saveClientField("emergency_contact",e.target.value||null)} />
              </span>
            </div>
          </div>

          <div style={{padding:"10px 20px", borderBottom:"1px solid #ccc", fontSize:15}}>

              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Time:</span> <select className="auto-select" value={r.time_in||""} onChange={e=>saveClientField("time_in",e.target.value||null)}><option value="">--</option>{TIME_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}># Days:</span> <strong>{r.num_days ?? "--"}</strong></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>DC/Extras:</span> <MoneyInput value={r.daycare_extra} onSave={v=>saveClientField("daycare_extra",v)} /></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Total:</span> <strong>{r.total != null ? fmtMoney(r.total) : "--"}</strong></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>% Off:</span> <select className="auto-select" value={r.percent_off??""} onChange={e=>saveClientField("percent_off",e.target.value?Number(e.target.value):null)}><option value="">--</option>{PERCENT_OFF_OPTIONS.map(o=><option key={o} value={o}>{o}%</option>)}</select></span>
              <span style={{fontWeight:700}}>Balance: <span style={{color:"#8B0000"}}>{r.balance != null ? fmtMoney(r.balance) : "--"}</span></span>

              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Date Out:</span> <DateInput value={r.date_out} onSave={v=>saveClientField("date_out",v)} /></span>

              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Price:</span> <MoneyInput value={r.price_per_day} onSave={v=>saveClientField("price_per_day",v)} /></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Cash:</span> <MoneyInput value={r.cash_discount} onSave={v=>saveClientField("cash_discount",v)} /></span>
              <span><span style={{fontSize:12,color:"#555",fontWeight:600}}>Down:</span> <MoneyInput value={r.down_payment} onSave={v=>saveClientField("down_payment",v)} /></span>

                <button onClick={()=>setConfirmDeletePet(true)} disabled={!currentPet} className="px-2 py-0.5 rounded text-white text-xs disabled:opacity-30" style={{background:"#8B0000"}}>Delete Pet</button>

            <div className="flex" style={{background:"#f0f0f0", borderBottom:"1px solid #ccc"}}>

                  style={{
                    padding:"10px 20px", fontSize:15, fontWeight:500, borderRight:"1px solid #ccc",
                    background: petIdx===i ? "#fff" : "#f0f0f0",
                    color: petIdx===i ? "#111" : "#888",

                      onBlur={e=>savePetField("pet_name",e.target.value||null)} />

                  <span style={{fontSize:16}}><span style={{fontSize:12,color:"#888"}}>Notes: </span><input className="auto-input" style={{width:220}} value={currentPet.notes||""} onChange={e=>setPets(p=>p.map(x=>x.id===currentPet.id?{...x,notes:e.target.value}:x))} onBlur={e=>savePetField("notes",e.target.value||null)} /></span>

                  <div style={{marginTop:6, fontSize:16}}>
                    <span style={{fontSize:12,color:"#888"}}>Legacy Meds: </span>
                    <input className="auto-input" style={{width:"80%"}} value={currentPet.medication_notes||""} onChange={e=>setPets(p=>p.map(x=>x.id===currentPet.id?{...x,medication_notes:e.target.value}:x))} onBlur={e=>savePetField("medication_notes",e.target.value||null)} />
                  </div>
                )}
              </div>
            ) : (
              <div className="p-8 text-center" style={{color:"#999"}}>
                No pets for this owner. Click "+ Add Pet" to create one.
              </div>
            )}
          </div>

          <div className="flex items-center justify-between px-3 py-2" style={{borderTop:"1px solid #ccc", background:"#f5f5f5"}}>
            <span className="text-xs" style={{color:"#999"}}>Use &larr; &rarr; arrow keys to navigate</span>
            <span className="text-xs font-bold tracking-wide" style={{color:"#555"}}>OWNER QUICK FIND</span>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RJPetsApp/>);
  </script>
</body>
</html>
